// Top-level build file for Sikwin
buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.0'
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}

// macOS flash drives create AppleDouble "._*" files that break AAPT.
subprojects { sub ->
    sub.tasks.configureEach { task ->
        def name = task.name
        if (name.contains("parse") && name.contains("LocalResources") ||
            name.contains("merge") && name.contains("Resources") ||
            name.contains("process") && name.contains("Resources") ||
            name.contains("package") && name.contains("Resources")
        ) {
            task.doFirst {
                def buildDir = file(sub.buildDir)
                if (buildDir.exists()) {
                    buildDir.eachFileRecurse { f ->
                        if (f.name.startsWith("._")) {
                            f.delete()
                        }
                    }
                }
            }
        }
    }
}
